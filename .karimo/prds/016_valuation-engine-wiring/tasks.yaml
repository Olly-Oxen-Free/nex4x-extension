  - id: 16i
    title: Add auditValuation() smoke to Nex4xDebugCommand
    description: |
      In src/nex4x/debug/Nex4xDebugCommand.java, add a new runcode target
      "audit_valuation" that:

      1. Constructs a TRADE_AGREEMENT NegotiableItem:
           NegotiableItem tradeItem = NegotiableItem.agreement(
               nex4x.agreements.AgreementType.TRADE_AGREEMENT);

      2. Creates two synthetic LeaderProfiles with different personalities:
           LeaderProfile mercantile = new LeaderProfile("hegemony", nex4x.leaders.Personality.MERCANTILE);
           LeaderProfile ruthless   = new LeaderProfile("hegemony", nex4x.leaders.Personality.RUTHLESS);

      3. Computes:
           int valMercantile = ItemValuator.valueForLeader(tradeItem, mercantile, "player");
           int valRuthless   = ItemValuator.valueForLeader(tradeItem, ruthless,   "player");

      4. Logs:
           "[Nex4x] MERCANTILE leader values trade_agreement item: " + valMercantile
           "[Nex4x] RUTHLESS leader values trade_agreement item: " + valRuthless
           float diff = Math.abs(valMercantile - valRuthless) / (float) Math.max(1, valMercantile);
           String pass = diff >= 0.20f ? "PASS" : "FAIL";
           "[Nex4x] Personality diff: " + String.format("%.1f%%", diff * 100f) + " — " + pass

      5. Computes scarcity smoke (only if sector is available):
           float scarcity = Valuator.scarcityMod("hegemony", "fuel");
           "[Nex4x] scarcityMod(hegemony, fuel): " + scarcity

      Build: ./build.sh — expected: green.
      Manual: in game console type "runcode nex4x.debug.Nex4xDebugCommand.auditValuation()"
      (exact invocation depends on DebugCommand routing; adapt as needed for existing
      dispatch pattern in that file).
    files:
      - src/nex4x/debug/Nex4xDebugCommand.java
    complexity: 1
    priority: must
    depends_on: [16e, 16f, 16g, 16h]
