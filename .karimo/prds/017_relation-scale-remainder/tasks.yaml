  - id: 17g
    title: DiplomacyTabOverlayModel — fix delta display in addDiplomacyHistory and DiploEventTooltip
    description: |
      src/nex4x/ui/DiplomacyTabOverlayModel.java
      DiploEventEntry.delta stores ExerelinReputationAdjustmentResult.delta, which
      inherits ReputationAdjustmentResult(float delta). Nexerelin passes raw -1..1
      floats to adjustRelations/adjustRelationship, so delta is e.g. 0.05 for a +5%
      event. Display must multiply by 100.

      addDiplomacyHistory (~line 400):
        String deltaStr = String.format("%+.0f", e.delta);   // "+0" for 0.05
        Fix: String deltaStr = String.format("%+.0f", e.delta * 100f);

      DiploEventTooltip.createTooltip (~line 659):
        String ds = String.format("%+.0f", e.delta);   // same bug
        Fix: String ds = String.format("%+.0f", e.delta * 100f);

      Do NOT change DiploEventEntry.delta field itself — it stores the raw API
      value and may be used elsewhere for comparisons.
      Do NOT use Nex4xRelations.toPercent here — inline multiply is fine for a
      local display-only conversion in an anonymous inner class context.
    files:
      - src/nex4x/ui/DiplomacyTabOverlayModel.java
    complexity: 1
    priority: must
    depends_on: []

