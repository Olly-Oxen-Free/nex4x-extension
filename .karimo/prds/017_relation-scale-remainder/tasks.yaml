prd: relation-scale-remainder
version: 1
tasks:

  - id: 17a
    title: Fix repBarAscii to accept percent scale
    description: |
      src/nex4x/ui/FactionBrowserPanelModel.java, line 544-553.
      Current signature: static String repBarAscii(float relationship)
      Current body: float t = (relationship + 100f) / 200f;   // expects -100..100
      Change: the method already expects percent scale internally — the body is
      correct. The bug is that all callers pass raw -1..1. Two options; pick
      option A (update callers, keep body) to be explicit:
        Option A — keep body as-is, document the contract, update all callers
                   to pass toPercent(rawRel) (tasks 17b, 17d, 17e, 17f do this).
      Add a one-line Javadoc: "@param relationshipPct relation in [-100..100]".
      No logic change to repBarAscii body needed — the formula is already correct
      for percent input. This task is documentation + Javadoc only, verifying
      the body, so callers know what to pass.
    files:
      - src/nex4x/ui/FactionBrowserPanelModel.java
    complexity: 1
    priority: must
    depends_on: []

  - id: 17b
    title: FactionBrowserPanelModel — fix addFactionRow (line ~121) and addRelationsTab (lines ~528,535)
    description: |
      src/nex4x/ui/FactionBrowserPanelModel.java
      addFactionRow (~line 119-145):
        Line 121: String relStr = String.format("%+.0f", rel);
        Fix: String relStr = String.format("%+d", Nex4xRelations.toPercentInt(rel));
        (No other change in this method — row text uses relStr for display only.)
      addRelationsTab (~lines 527-541):
        Line 528: float r = f.getRelationship(o.getId());
        Line 529: String rStr = String.format("%+.0f", r);   // raw
        Fix line 529: String rStr = String.format("%+d", Nex4xRelations.toPercentInt(r));
        Line 535: card.addPara(repBarAscii(r), relCol, 2f);  // raw
        Fix line 535: card.addPara(repBarAscii(Nex4xRelations.toPercent(r)), relCol, 2f);
      Add import nex4x.util.Nex4xRelations if not present (it is already imported
      in some other methods — check before adding).
    files:
      - src/nex4x/ui/FactionBrowserPanelModel.java
    complexity: 1
    priority: must
    depends_on: [17a]

