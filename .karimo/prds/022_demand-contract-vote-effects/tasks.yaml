  - id: 22j
    title: Implement vote resolution loop in CoalitionGovernance.advanceDay()
    description: |
      File: src/nex4x/coalitions/CoalitionGovernance.java
      Current advanceDay() (line 94-98) only prunes already-resolved votes. Replace with:

        public void advanceDay() {
            for (CoalitionTension t : tensions) t.decay(TENSION_DECAY_PER_DAY);
            for (CoalitionVote vote : pendingVotes) {
                if (vote.isResolved()) continue;
                if (!vote.isExpired()) continue;
                // Resolve with real member count
                String coalitionKey = buildCoalitionKey(vote);
                List<String> members = getCoalitionMembers(vote.getProposerFactionId());
                int memberCount = members.size();
                String leader = getBlocLeader(members);
                // Auto-cast abstentions for members who haven't voted
                for (String memberId : members) {
                    if (!vote.getVotes().containsKey(memberId)) {
                        // abstain = no cast = excluded from quorum numerator
                        // (do NOT call castVote — just let them be absent from denominator)
                    }
                }
                boolean decided = vote.resolve(leader, memberCount);
                if (decided && vote.isPassed()) {
                    applyVoteEffect(vote, members);
                } else if (!decided) {
                    log.info("[Nex4x] Vote FAILED_QUORUM: " + vote.getType()
                        + " in coalition of " + memberCount);
                }
            }
            // Prune resolved
            Iterator<CoalitionVote> it = pendingVotes.iterator();
            while (it.hasNext()) if (it.next().isResolved()) it.remove();
        }

      Add private void applyVoteEffect(CoalitionVote vote, List<String> members):
        switch (vote.getType()) {
          case ADD_MEMBER:
            // Notify AgreementManager to create agreements between new member + all existing
            // SHOULD: call AgreementManager.createAgreement for each pair (complex —
            //   use a callback interface or static accessor to avoid circular deps).
            log.info("[Nex4x] Coalition vote ADD_MEMBER passed: " + vote.getTargetFactionId());
            break;
          case KICK_MEMBER:
            // Cancel all coalition agreements involving the kicked member.
            log.info("[Nex4x] Coalition vote KICK_MEMBER passed: " + vote.getTargetFactionId());
            break;
          case DISSOLVE:
            // Cancel all coalition agreements among members.
            log.info("[Nex4x] Coalition vote DISSOLVE passed");
            break;
          case DECLARE_WAR:
            // Call NexDiplomacyBridge or DiplomacyManager to declare war (coalition vs target).
            nex4x.integration.NexDiplomacyBridge.fireCoalitionWarDeclaration(
                members, vote.getTargetFactionId());
            break;
          case MAKE_PEACE:
            nex4x.integration.NexDiplomacyBridge.firePeaceTreaty(
                Global.getSector().getFaction(vote.getProposerFactionId()),
                Global.getSector().getFaction(vote.getTargetFactionId()));
            break;
        }

      Add private List<String> getCoalitionMembers(String anyMemberId):
        Delegate to Nex4xManager's AgreementManager.getCoalitionMembers(anyMemberId, anyMemberId)
        (or equivalent transitive-member-list method). This provides the authoritative
        denominator for quorum. If AgreementManager lacks a single-faction lookup, add one.

      Notes on complexity: ADD_MEMBER/KICK_MEMBER/DISSOLVE effects touch AgreementManager
      and possibly NexDiplomacyBridge. Full wiring of add/kick/dissolve is marked SHOULD
      within this task — the must-complete portion is quorum-correct resolution + DECLARE_WAR
      + MAKE_PEACE effects.
    files:
      - src/nex4x/coalitions/CoalitionGovernance.java
    complexity: 3
    priority: must
    depends_on: [22i]

  - id: 22k
    title: Wire proposeVote() call site from AgreementManager or DiplomaticExecutor
    description: |
      Choose ONE of two wiring points (whichever has less cross-dependency risk):
        Option A — AgreementManager.createAgreement (line 66, COALITION branch):
          After the NexDiplomacyBridge.syncCoalitionToAlliance call, if this is an upgrade
          (an existing coalition gains a member), propose an ADD_MEMBER vote:
            CoalitionGovernance.getOrCreate().proposeVote(
                CoalitionVote.VoteType.ADD_MEMBER, factionA, factionB);
          Cast immediate YEA votes for both proposing parties:
            vote.castVote(factionA, true);
            vote.castVote(factionB, true);
          AI members in the existing coalition will vote in advanceDay (22l).

        Option B — DiplomaticExecutor: on COALITION-tier goal completion (after
          proposeAgreementIfViable produces a COALITION agreement), propose a DECLARE_WAR
          vote against a shared hostile faction if both factions are at war with the same
          target.

      Recommendation: implement Option A (coalition formation is the more common trigger
      and has a concrete call site at AgreementManager line 66).
    files:
      - src/nex4x/agreements/AgreementManager.java
    complexity: 2
    priority: must
    depends_on: [22j]

  - id: 22l
    title: Wire AI vote-casting into DiplomaticExecutor.advanceDay()
    description: |
      File: src/nex4x/ai/DiplomaticExecutor.java
      In advanceDay(), add call: evaluateCoalitionVotes(goalMgr, archetype);

      New private method evaluateCoalitionVotes:
        - Get CoalitionGovernance.getOrCreate().getPendingVotes().
        - For each vote where proposerFactionId or targetFactionId involves this faction
          OR this faction is a coalition member of the proposer:
            * If factionId has already voted: skip.
            * Score the vote based on archetype + tendency:
                DECLARE_WAR: inFavor = archetype.isMilitary() || warDesire > 50f
                MAKE_PEACE:  inFavor = peaceWillingness > 50f
                ADD_MEMBER:  inFavor = relations(factionId, target) > 0.1f
                KICK_MEMBER: inFavor = relations(factionId, target) < -0.1f
                DISSOLVE:    inFavor = tension > DISSOLUTION_TENSION_THRESHOLD
            * Call vote.castVote(factionId, inFavor).
        - Budget: vote casting is budget-exempt (low-overhead decision).
    files:
      - src/nex4x/ai/DiplomaticExecutor.java
    complexity: 2
    priority: must
    depends_on: [22j, 22k]

  # ── SMOKE / DEBUG ─────────────────────────────────────────────────────────

  - id: 22m
    title: Add auditDemands(), auditContracts(), auditVotes() to Nex4xDebugCommand
    description: |
      File: src/nex4x/debug/Nex4xDebugCommand.java
      Add three new static String methods (console-runcode callable):

      auditDemands():
        - Iterate DemandManager.getOrCreate().getAll().
        - Print each demand: id, demanderId -> targetId, type, status, expiryDay.
        - Count by status (PENDING / ACCEPTED / REJECTED / EXPIRED).
        Output example:
          [nex4x audit-demands]
            hegemony -> persean : TRIBUTE_CREDITS [ACCEPTED]  expires day 312
            ...
          Total: 3 demands (1 pending, 1 accepted, 1 expired)

      auditContracts():
        - Iterate ContractAuctionManager.getOrCreate().getAll().
        - Print id, issuer, target, type, status, winner (if any), pay amount (second-price).
        - For COMPLETED contracts also print "influence delta" or "credits delta (player)".

      auditVotes():
        - Iterate CoalitionGovernance.getOrCreate().getPendingVotes().
        - Print type, proposer, target, resolved (Y/N), passed (Y/N/pending),
          failedQuorum (Y/N), voteCount.
        - Also call getBlocLeader for each proposer's coalition and print leader id.

      All three methods call getCampaignUI().addMessage() with the result string.
    files:
      - src/nex4x/debug/Nex4xDebugCommand.java
    complexity: 2
    priority: must
    depends_on: [22c, 22f, 22j]

