  # ── SUBSYSTEM A: DEMANDS ──────────────────────────────────────────────────

  - id: 22a
    title: Add FORCE_NEUTRALITY to Demand.DemandType
    description: |
      File: src/nex4x/demands/Demand.java
      Add FORCE_NEUTRALITY at the end of the DemandType enum (preserves ordinal order
      for save compatibility). This type instructs the target to cease hostilities with
      a named third party (payload = third-party faction id).
