  # ── SUBSYSTEM C: COALITION VOTES ──────────────────────────────────────────

  - id: 22i
    title: Remove/retire CoalitionVote.resolve(String) back-compat overload
    description: |
      File: src/nex4x/coalitions/CoalitionVote.java
      Line 78: the single-arg resolve(String blocLeaderId) calls resolve(blocLeaderId, 0).
      memberCount=0 causes the quorum check at line 61 to be skipped (0 > 0 is false,
      so the guard branch is never entered).

      Replace body with:
        throw new UnsupportedOperationException(
