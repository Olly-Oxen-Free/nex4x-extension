  - id: 22b
    title: Add demand cooldown tracking to DiplomaticExecutor
    description: |
      File: src/nex4x/ai/DiplomaticExecutor.java
      Add a transient Map<String, Float> demandCooldowns (demandee factionId -> day of
      last issued demand). Serialized field not needed (transient OK — resets on load,
      which is safe). Default cooldown: DEMAND_COOLDOWN_DAYS = 30f (configurable via
      loadConfig JSON key "demandCooldownDays"). Add helper:
        private boolean canIssueDemand(String targetId) {
            Float last = demandCooldowns.get(targetId);
            if (last == null) return true;
            return (nex4x.util.Nex4xClock.currentAbsoluteDay() - last) >= DEMAND_COOLDOWN_DAYS;
        }
      and a setter that records the day. This guard is checked before any demand is issued.
    files:
      - src/nex4x/ai/DiplomaticExecutor.java
    complexity: 1
    priority: must
    depends_on: []

  - id: 22c
    title: Wire PRESS_GRIEVANCE/EXPLOIT_WEAKNESS to DemandManager.issue()
    description: |
      File: src/nex4x/ai/DiplomaticExecutor.java
      In executeDiplomaticAction, add cases for GoalType.PRESS_GRIEVANCE and
      GoalType.EXPLOIT_WEAKNESS. For each:
        1. Check canIssueDemand(goal.targetFactionId). Skip if cooling down.
        2. Check DemandManager.getOrCreate().getPending(factionId) — skip if 2+ pending
           demands already active (spam guard).
        3. Choose DemandType based on archetype + goal type:
             PRESS_GRIEVANCE + MILITARY_SUPREMACY/TERRITORIAL_EXPANSION → TRIBUTE_CREDITS
             PRESS_GRIEVANCE + IDEOLOGICAL_CRUSADE → BREAK_ALLIANCE
             EXPLOIT_WEAKNESS (any archetype) → CEDE_MARKET if target has a contested
               market (use FactionMarketUtil.firstMarketOfFaction), else TRIBUTE_CREDITS.
        4. Compute pressureCost = 20f, influenceCost = 15f (hardcoded defaults for now;
           configurable via loadConfig "demandCosts" JSON block in 22h).
        5. Call DemandManager.getOrCreate().issue(factionId, goal.targetFactionId, type,
           payload, pressureCost, influenceCost). If non-null, record cooldown.
        6. Decrement actionBudgetRemaining (budgeted action).
      Verified entry point: DiplomaticExecutor.java line 277 executeDiplomaticAction switch.
    files:
      - src/nex4x/ai/DiplomaticExecutor.java
    complexity: 3
    priority: must
    depends_on: [22a, 22b]

  - id: 22d
    title: Wire AI accept/reject of incoming demands
    description: |
      File: src/nex4x/ai/DiplomaticExecutor.java
      At the TOP of advanceDay() (before war/peace evaluation), add:
        evaluateIncomingDemands(goalMgr, archetype);
      New private method evaluateIncomingDemands:
        - Calls DemandManager.getOrCreate().getPending(factionId).
        - For each pending demand where targetId == factionId (i.e., directed at us):
            * Compute acceptWillingness score:
                base 40f
                + if MILITARY_SUPREMACY archetype and TRIBUTE type: -30f (resistors)
                + if FEDERALISTS tendency > 0.5: +15f (compliant)
                + war weariness contribution (war ongoing vs demander: -20f resistance)
                + random -20..+20 jitter
            * If score >= 60f: DemandManager.getOrCreate().accept(demand)
            * Else: DemandManager.getOrCreate().reject(demand)
        - Uses WAR_PEACE_EXEMPT = true (budget exempt).
      This ensures every pending demand is resolved within its 14-day window by AI factions
      without waiting for expiry.
    files:
      - src/nex4x/ai/DiplomaticExecutor.java
    complexity: 2
    priority: must
    depends_on: [22c]

