  # ── SUBSYSTEM B: CONTRACTS ────────────────────────────────────────────────

  - id: 22f
    title: Implement ContractAuctionManager.complete() with influence transfer + covert dispatch
    description: |
      File: src/nex4x/contracts/ContractAuctionManager.java
      Replace the stub body of complete(Contract c, boolean success) starting at line 71:

        if (c.getStatus() != Contract.Status.AWARDED) return;
        c.setStatus(success ? Contract.Status.COMPLETED : Contract.Status.FAILED);

      Add after status flip (success path only):
        1. Compute influence payment:
             long pay = (c.getWinningBid() != null && c.getWinningBid().getCredits() > 0)
                        ? computeSecondPrice(c) : c.getReservePrice();
             // computeSecondPrice: same logic as resolveAuction's pay var — extract helper.
           Note: resolveAuction already computes pay locally; extract to private
             long computeSecondPrice(Contract c) to reuse here.

        2. Transfer payoff:
             String winnerId = c.getWinningBid().getBidderFactionId();
             boolean playerWon = winnerId.equals(
                 Global.getSector().getPlayerFaction().getId());
             if (playerWon) {
                 // DESIGN: player fleet can receive literal credits.
                 Global.getSector().getPlayerFleet().getCargo().getCredits().add(pay);
                 log.info("[Nex4x] Contract " + c.getId() + " paid " + pay
                     + " credits to player fleet");
             } else {
                 // DESIGN: AI factions cannot hold credits — model as influence.
                 float influence = (float)(pay * CONTRACT_INFLUENCE_RATE);
                 nex4x.influence.InfluenceManager.getOrCreate()
                     .addLump(winnerId, influence, nex4x.influence.InfluenceSource.CONTRACT_PAYOFF);
                 log.info("[Nex4x] Contract " + c.getId() + " — influence +"
                     + influence + " to " + winnerId + " (credits=" + pay + ")");
             }

        3. Dispatch covert action:
             try {
                 dispatchContractAction(c, winnerId);
             } catch (Throwable t) {
                 log.warn("[Nex4x] Contract covert dispatch failed: " + t.getMessage());
             }

      Add constant: static final float CONTRACT_INFLUENCE_RATE = 0.1f;

      Add private void dispatchContractAction(Contract c, String executorFactionId):
        - Look up a Nex agent owned by executorFactionId via
            exerelin.campaign.covertops.CovertOpsManager (try/catch Nex unavailable).
        - If found: queue action matching c.getType() (HARASS_FACTION →
            ActionDefIds.GUERRILLA_HIRE_MERCS or best match; SABOTAGE_INDUSTRY →
            ActionDefIds.GUERRILLA_FALSE_FLAG; etc. — use best-effort mapping, document
            unmapped types).
        - If no agent found: log "[Nex4x] Contract " + c.getId()
            + " — no executor agent available for " + executorFactionId + "; skipping dispatch".
      New constant block: CONTRACT_TYPE_TO_ACTION_DEF mapping (static Map initialization).
    files:
      - src/nex4x/contracts/ContractAuctionManager.java
    complexity: 3
    priority: must
    depends_on: []

